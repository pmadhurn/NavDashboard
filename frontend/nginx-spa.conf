# Serves the built SPA inside the frontend container. The edge nginx keeps
# proxying to frontend:3000, so the compose topology is the same in dev and
# prod — only what answers on 3000 changes.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    # Only add_header here — `expires` would emit a second, conflicting
    # Cache-Control on the same response.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading the old bundle
    # after a deploy and request asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: React Router owns the path space, so any unmatched
    # URL has to return index.html. Without this, refreshing /devices 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
