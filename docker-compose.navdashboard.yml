# navdashboard.com — the real address — WITHOUT giving up nav.madhur.dev.
#
# Use as a third overlay, on top of the tunnel one:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.tunnel.yml \
#                  -f docker-compose.navdashboard.yml up -d
#
# Why three files instead of docker-compose.prod.yml
# --------------------------------------------------
# prod.yml is the *cutover* shape: a dedicated tunnel and NOTHING published to
# the host, so nav.madhur.dev — which rides the host's systemd cloudflared via
# 127.0.0.1:8085 — would go dark the moment it started. That is a fine end
# state, but a deployment with no second way in is a deployment you cannot
# diagnose from the outside when the new tunnel misbehaves.
#
# This file keeps tunnel.yml's loopback publish (nav.madhur.dev keeps working,
# still reachable only through the host tunnel — nothing is on a public
# interface) and ADDS a dedicated cloudflared container for navdashboard.com,
# which dials out from inside the compose network and therefore reaches the app
# as `nginx:80`, not as a host port.
#
# Two tunnels, two accounts, one stack: the host tunnel belongs to the
# madhur.dev Cloudflare account, this one to the account that owns
# navdashboard.com. A tunnel is scoped to the account that created it, which is
# exactly why the zone never has to move between accounts.
#
# Requires TUNNEL_TOKEN in a gitignored .env next to this file.
services:
  backend:
    environment:
      ENVIRONMENT: production
      # Every origin the app answers on. The moment this is not "*",
      # allow_credentials flips on (backend/core/config.py) — so this list has
      # to be complete or the browser silently drops cookies on the missing one.
      CORS_ORIGINS: https://navdashboard.com,https://www.navdashboard.com,https://nav.madhur.dev

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # NEVER inline the token here. The previous one was committed to this
      # repo's history and had to be revoked; .env is gitignored for this reason.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set — see .env}
    depends_on:
      - nginx
    networks:
      - navdashboard
    restart: unless-stopped
