# NavDashboard — the whole stack, one file.
#
#   docker compose up -d --build
#
# The app is served on 127.0.0.1:8085. Nothing is exposed on a public
# interface; put a Cloudflare tunnel (or any reverse proxy) in front of that
# port. The tunnel is deliberately NOT part of this file — it is run and
# maintained separately.
#
# Origin settings for the tunnel:
#   Service type : HTTP
#   URL          : localhost:8085     (cloudflared started with --network host)
services:
  nginx:
    image: nginx:alpine
    # Loopback only: the tunnel dials this; nothing else on the network can.
    # 8080 is taken on this host by open-webui, hence 8085.
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - navdashboard
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # The built static bundle, served by nginx — not the Vite dev server.
      # Source edits need `up -d --build`, not a restart.
      target: production
    networks:
      - navdashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Backups only. No source mount: the running code is the built image.
      - ./database/backups:/backups
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      # Once this is not "*", allow_credentials turns on (core/config.py), so
      # every origin the app answers on has to be listed here.
      CORS_ORIGINS: https://navdashboard.com,https://www.navdashboard.com,https://nav.madhur.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - navdashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: navdashboard
      POSTGRES_USER: navdashboard
      POSTGRES_PASSWORD: navdashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backups:/backups
    networks:
      - navdashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navdashboard -d navdashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - navdashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-navdashboard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-navdashboard_minio_secret}
    volumes:
      - minio_data:/data
    networks:
      - navdashboard
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  minio_data:
  redis_data:

networks:
  navdashboard:
    driver: bridge
    driver_opts:
      # Pin the host-side interface name. By default Docker generates
      # br-<hash-of-network-id>, which changes every time the network is
      # recreated — and the host firewall allows container→host traffic per
      # *interface name*, so a regenerated name silently breaks the backend's
      # access to the host's Ollama on 11434 ([Errno 113] No route to host).
      com.docker.network.bridge.name: br-navdash
